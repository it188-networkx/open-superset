name: PR CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Plan PR checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
      app: ${{ steps.plan.outputs.app }}
      server: ${{ steps.plan.outputs.server }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - id: plan
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: python3 .github/scripts/ci.py plan

  backend:
    needs: check
    if: needs.check.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    env:
      TZ: UTC
      PYTHONPATH: ${{ github.workspace }}
      SUPERSET_TESTENV: 'true'
      SUPERSET_SECRET_KEY: not-a-secret
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ matrix.python }}
      - run: echo "SUPERSET_HOME=$RUNNER_TEMP/superset-test" >> "$GITHUB_ENV"
      - run: pytest --durations-min=0.5 --cov-report= --cov=superset ./tests/common ./tests/unit_tests --cache-clear --maxfail=50
      - run: pytest --cov=superset/sql/ ./tests/unit_tests/sql/ --cache-clear --cov-fail-under=100

  frontend-tests:
    needs: check
    if: needs.check.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      NODE_OPTIONS: --max-old-space-size=5120
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      CYPRESS_INSTALL_BINARY: '0'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    defaults:
      run:
        working-directory: superset-frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '20.18.1'
          cache: npm
          cache-dependency-path: superset-frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - env:
          NODE_ENV: test
          SHARD: ${{ matrix.shard }}
        run: npx jest --ci --maxWorkers=2 --shard="$SHARD/8"

  frontend-build:
    needs: check
    if: needs.check.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=5120
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      CYPRESS_INSTALL_BINARY: '0'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    defaults:
      run:
        working-directory: superset-frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '20.18.1'
          cache: npm
          cache-dependency-path: superset-frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx webpack --mode production
        env:
          NODE_ENV: production
          BABEL_ENV: production

  quality:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NODE_OPTIONS: --max-old-space-size=5120
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      CYPRESS_INSTALL_BINARY: '0'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-backend
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '20.18.1'
          cache: npm
          cache-dependency-path: superset-frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: superset-frontend
      - run: npm run plugins:build
        working-directory: superset-frontend
      - run: yarn install --frozen-lockfile
        working-directory: docs
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: false
      - run: go install github.com/norwoodj/helm-docs/cmd/helm-docs@v1.14.2
      - uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py3.11-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pre-commit run --all-files
      - run: git diff --exit-code

  required:
    name: PR checks
    needs: [check, backend, frontend-tests, frontend-build, quality]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Require all planned checks to succeed
        env:
          PLAN_RESULT: ${{ needs.check.result }}
          PLAN_RUN: ${{ needs.check.outputs.run }}
          APP: ${{ needs.check.outputs.app }}
          SERVER: ${{ needs.check.outputs.server }}
          BACKEND: ${{ needs.backend.result }}
          TESTS: ${{ needs.frontend-tests.result }}
          BUILD: ${{ needs.frontend-build.result }}
          QUALITY: ${{ needs.quality.result }}
        run: |
          PLAN_RUN="$SERVER" VALIDATION_RESULT="$BACKEND" python3 .github/scripts/ci.py gate
          PLAN_RUN="$APP" VALIDATION_RESULT="$TESTS" python3 .github/scripts/ci.py gate
          PLAN_RUN="$APP" VALIDATION_RESULT="$BUILD" python3 .github/scripts/ci.py gate
          VALIDATION_RESULT="$QUALITY" python3 .github/scripts/ci.py gate
